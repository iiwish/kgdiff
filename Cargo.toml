# The Rust half of kgdiff (RFC 0002, docs/rfcs/0002-rust-compute-core.md). One version for every
# crate, equal to the npm packages' version: `pnpm version-packages` writes it here
# (scripts/sync-versions.ts) and tests/release.test.ts fails when the two drift apart.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.10.0"
edition = "2024"
# RFC 0002, D-8: no newer than the stable release of six months before, raised only in minor
# releases. rust-toolchain.toml pins the toolchain CI and contributors build with.
rust-version = "1.95"
license = "MIT"
authors = ["iiwish"]
repository = "https://github.com/iiwish/kgdiff"
homepage = "https://github.com/iiwish/kgdiff"

[workspace.dependencies]
# Development only: the conformance harness reads the corpus's manifest and case files with it
# until kgdiff-core's own JSON reader exists. No document kgdiff reads or writes goes through
# serde_json (RFC 0002, D-12).
serde_json = "1.0.149"
# The workspace's own crates, required at exactly the one version (scripts/sync-versions.ts keeps
# these equal to it): kgdiff X.Y.Z names one consistent set of crates on crates.io.
kgdiff-core = { version = "=0.10.0", path = "crates/kgdiff-core" }
kgdiff-formats = { version = "=0.10.0", path = "crates/kgdiff-formats" }
kgdiff-report = { version = "=0.10.0", path = "crates/kgdiff-report" }
kgdiff-layout = { version = "=0.10.0", path = "crates/kgdiff-layout" }

# The lints every engine crate opts into with `[lints] workspace = true` (RFC 0002, §3,
# Enforcement). The bindings crates set their own.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Number to integer goes through js::to_uint32 / js::to_int32 (ToUint32 / ToInt32, J-35): `as`
# saturates where JavaScript wraps.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"

# The native binaries `dist` builds (dist-workspace.toml): release, thin LTO, without symbols.
[profile.dist]
inherits = "release"
lto = "thin"
strip = "symbols"
