# The Python distribution `pykgdiff` (RFC 0002, D-6 / D-7): for now only the kgdiff command line,
# as one wheel per native target holding the binary dist built for the release (the same binary
# as @kgdiff/cli's platform packages and the GitHub release's archives). The wheels have no
# Python module: `import pykgdiff` and `python -m pykgdiff` are kept for the Python API, after 1.0.
#
# This file is read by scripts/pypi-wheels.py, which assembles the wheels from dist's archives
# and adds the repository's LICENSE to each. There is no build backend and no sdist: building
# kgdiff from source needs Rust and the viewer bundles (docs/releasing.md). `version` is the
# workspace's, written by scripts/sync-versions.ts and checked by tests/release.test.ts.

[project]
name = "pykgdiff"
version = "0.12.1"
description = "git diff for knowledge graphs: the kgdiff command line, as a native binary. Compare two graph files from the terminal, CI, or as a shareable HTML report."
readme = "README.md"
license = "MIT"
authors = [{ name = "iiwish" }]
keywords = ["kgdiff", "cli", "diff", "knowledge-graph", "ontology", "rdf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Version Control",
]

[project.urls]
Homepage = "https://github.com/iiwish/kgdiff"
Documentation = "https://github.com/iiwish/kgdiff/blob/main/docs/cli.md"
Repository = "https://github.com/iiwish/kgdiff"
Issues = "https://github.com/iiwish/kgdiff/issues"
Changelog = "https://github.com/iiwish/kgdiff/releases"
