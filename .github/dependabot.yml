version: 2

updates:
  - package-ecosystem: npm # pnpm workspace: package.json files + pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    # Leave new releases a week to be yanked or flagged before they reach a pull request.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      # Tooling moves in lockstep (vitest + coverage, vite, typescript, biome…): one PR a week.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime-dependencies:
        dependency-type: production
        update-types: [patch]

  - package-ecosystem: cargo # the Rust workspace: Cargo.toml files + Cargo.lock
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions # keeps the SHA pins and their version comments current
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
