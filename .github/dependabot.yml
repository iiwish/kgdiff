version: 2

updates:
  - package-ecosystem: npm # pnpm workspace: package.json files + pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    # Leave new releases a week to be yanked or flagged before they reach a pull request.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      # Tooling moves in lockstep (vitest + coverage, vite, typescript, biome…): one PR a week.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime-dependencies:
        dependency-type: production
        update-types: [patch]

  - package-ecosystem: cargo # the Rust workspace: Cargo.toml files + Cargo.lock
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        update-types: [minor, patch]
    ignore:
      # kgdiff-wasm names getrandom 0.3 only to turn on `wasm_js` for the copy oxrdf pulls in through
      # rand 0.9. A 0.4 there leaves that copy without a wasm32 backend (#132). Lift this once oxrdf
      # is on rand 0.10.
      - dependency-name: getrandom
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions # keeps the SHA pins and their version comments current
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
