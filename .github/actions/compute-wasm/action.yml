name: Build the WebAssembly modules of @kgdiff/compute
description: >-
  Installs the toolchain of rust-toolchain.toml, the wasm-bindgen CLI crates/kgdiff-wasm pins and
  wasm-opt, then builds packages/compute/wasm/ (pnpm --filter @kgdiff/compute build:wasm, which
  fails when a module is above its size limit). Linux x86-64 runners only (wasm-opt's download).
  Needs `pnpm install` first. Since 0.11 every test, the site and the viewer bundles need the
  modules: the jobs that build them run this or download its artifact.
inputs:
  cache:
    description: Restore and save the Cargo cache (false in release builds).
    default: "true"
runs:
  using: composite
  steps:
    - name: Install the toolchain of rust-toolchain.toml
      shell: bash
      run: rustup toolchain install
    - if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    # The exact version crates/kgdiff-wasm pins (wasm-bindgen = "=…").
    - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
      with:
        tool: wasm-bindgen@0.2.129
    - name: Install wasm-opt (binaryen version_133, checksum verified)
      shell: bash
      run: |
        curl -fsSL -o "$RUNNER_TEMP/binaryen.tar.gz" \
          https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
        echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
    - name: Build the three modules (sizes in the job summary)
      shell: bash
      run: pnpm --filter @kgdiff/compute build:wasm
