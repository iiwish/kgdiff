name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its older run; every commit on main keeps its own run
  # (and its own status).
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every supported Node.js line (engines: >=22) on Linux; the CLI's atomic writes and
        # (device, inode) checks also run on Windows and macOS file systems.
        os: [ubuntu-latest]
        node: [22, 24, 26]
        include:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # pnpm test generates the corpus with the CLI in-process; this runs the built CLI as a real
      # process (pipes, exit codes, clean environment), as another implementation is checked.
      - name: Replay the conformance corpus's CLI runs with the built kgdiff
        run: pnpm conformance:replay
      - name: Check the packed packages (README, LICENSE, source maps, publint, attw)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: pnpm check:packages
      - name: Build the site and the docs (a dead link in the docs fails the build)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: pnpm build:site

  # The one check the main branch ruleset requires: it passes only when every job of the matrix
  # passed, so the matrix can change without touching the ruleset.
  passed:
    name: CI passed
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job of the matrix passed
        env:
          RESULT: ${{ needs.check.result }}
        run: test "$RESULT" = success
