name: Differential

# RFC 0002, §8: until phase 5 retires the TypeScript compute code, every night compares the
# TypeScript and the Rust implementation byte for byte on seeded random graph pairs
# (scripts/differential.ts writes them with TypeScript's outputs; crates/kgdiff-core/tests/
# differential.rs recomputes them). A mismatch becomes a corpus case with its fix.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      pairs:
        description: Random pairs
        default: "10000"
      synthetic:
        description: gen-synthetic pairs (40 to 400 nodes)
        default: "50"
      seed:
        description: Seed (default the run number)
        default: ""

permissions:
  contents: read

concurrency:
  group: differential
  cancel-in-progress: false

jobs:
  differential:
    name: TypeScript and Rust agree on random pairs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PAIRS: ${{ inputs.pairs || '10000' }}
      SYNTHETIC: ${{ inputs.synthetic || '50' }}
      SEED: ${{ inputs.seed || github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Generate the pairs and TypeScript's outputs
        run: pnpm tsx scripts/differential.ts --pairs "$PAIRS" --synthetic "$SYNTHETIC" --seed "$SEED" --out "$RUNNER_TEMP/differential.jsonl"
      - name: Recompute them in Rust
        run: |
          echo "Reproduce: pnpm tsx scripts/differential.ts --pairs $PAIRS --synthetic $SYNTHETIC --seed $SEED --out target/differential.jsonl"
          KGDIFF_DIFFERENTIAL="$RUNNER_TEMP/differential.jsonl" cargo test --release --locked -p kgdiff-core --test differential -- --nocapture
      - name: Keep the pairs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differential-${{ env.SEED }}
          path: ${{ runner.temp }}/differential.jsonl
          retention-days: 14
