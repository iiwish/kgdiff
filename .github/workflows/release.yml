name: Release

# On every push to main, changesets/action either opens / updates the "Version Packages" pull
# request (while there are changesets in .changeset/), or, once that pull request is merged,
# builds, checks and publishes the packages that have a new version, then tags the release and
# creates one GitHub release for it.
#
# Publishing uses npm trusted publishing (OIDC): no npm token is stored anywhere, and npm adds a
# provenance attestation to every version. Setup and the first publish: docs/releasing.md.
#
# Everything is built before anything is published (RFC 0002, §8). On a push that releases (no
# changesets left, and @kgdiff/cli's version not on npm yet), the native kgdiff is built for every
# target with dist (dist-workspace.toml), its crates are packaged (`cargo publish --dry-run`), and
# the platform packages of @kgdiff/cli are assembled from dist's archives and run through the
# launcher on Linux (glibc and musl), macOS and Windows, and the wheels of the Python package
# pykgdiff (the command line only) are assembled from the same archives and installed with pip on
# the same platforms; only then does "Version or publish" publish the platform packages,
# @kgdiff/cli (which lists them as optional dependencies) and the other packages.
# A pull request that changes this setup, or a run by hand (workflow_dispatch), builds and checks
# all of it without publishing. The crates, the GitHub release's archives and the Homebrew
# formula, and the wheels on PyPI are published after npm, once the repository variables
# CRATES_RELEASE_ENABLED, NATIVE_RELEASE_ENABLED and PYPI_RELEASE_ENABLED are set
# (docs/releasing.md, "Native binaries and crates" and "PyPI").

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - dist-workspace.toml
      - packages/cli/**
      - python/**
      - scripts/npm-platforms.ts
      - scripts/npm-smoke.mjs
      - scripts/pypi-smoke.py
      - scripts/pypi-wheels.py
  workflow_dispatch:

permissions: {}

concurrency:
  # Releases queue up; a check run of a pull request or by hand has a group of its own.
  group: ${{ github.event_name == 'push' && 'release' || format('release-check-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  # Whether this push releases: changesets/action publishes when no changeset is left, and there is
  # something to publish when @kgdiff/cli's version is not on npm yet (one version for every
  # package), or when it is but the release was not finished: the tag v<version>, which
  # "Version or publish" creates once npm has everything, is missing (a run that failed after
  # publishing some packages, as 0.11.0's did). Then the native builds below run first. With
  # changesets pending, "Version or publish" runs at once and opens or updates the version pull
  # request. With neither, there is nothing to do and "Version or publish" is skipped: with no
  # changeset, changesets/action always runs `pnpm release`, whose `pnpm check` needs the modules
  # of @kgdiff/compute, built only for a release (compute-wasm).
  plan:
    name: Plan the release
    # Not in forks, and not before the first release, which is published by hand: set the
    # repository variable RELEASE_ENABLED to true once trusted publishing is configured
    # (docs/releasing.md).
    if: github.event_name == 'push' && github.repository == 'iiwish/kgdiff' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      # Changesets are pending: "Version or publish" opens or updates the version pull request.
      changesets: ${{ steps.plan.outputs.changesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: |
          version=$(jq -r .version packages/cli/package.json)
          pending=$(find .changeset -name '*.md' ! -name README.md | wc -l)
          published=$(npm view "@kgdiff/cli@$version" version 2> /dev/null || true)
          # 0: the tag exists; 2: it does not; anything else is an error and fails the step.
          tagged=0
          git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/v$version" > /dev/null || tagged=$?
          test "$tagged" = 0 || test "$tagged" = 2
          if [ "$pending" -gt 0 ]; then
            echo "changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "changesets=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$pending" -eq 0 ] && [ -z "$published" ]; then
            echo "Releasing $version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$pending" -eq 0 ] && [ "$tagged" = 2 ]; then
            echo "Finishing the release of $version: @kgdiff/cli is on npm, v$version is not tagged"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$pending" -gt 0 ]; then
            echo "Not a release: $pending changesets, for the version pull request"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to release: no changesets, $version is on npm and tagged v$version"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  # The WebAssembly modules of @kgdiff/compute (RFC 0002, §7), built before anything is published
  # and packed by `pnpm release` from the artifact: the publishing job builds no Rust.
  compute-wasm:
    name: Build the WebAssembly modules of @kgdiff/compute
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      KGDIFF_COMPUTE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No caches in a release build: a poisoned cache would end up in the packages.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      # The exact version crates/kgdiff-wasm pins (wasm-bindgen = "=…").
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Install wasm-opt (binaryen version_133, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/binaryen.tar.gz" \
            https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - name: Build the modules (fails above a size limit)
        run: pnpm --filter @kgdiff/compute build:wasm
      - name: The corpus and the API against the modules
        run: pnpm vitest run --project compute
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compute-wasm
          path: |
            packages/compute/wasm/*.wasm
            packages/compute/wasm/*.js
            packages/compute/wasm/sizes.json
            packages/compute/test/wasm/
          if-no-files-found: error

  release:
    name: Version or publish
    needs:
      [
        plan,
        native-global,
        crates-dry-run,
        npm-smoke,
        npm-smoke-musl,
        pypi-smoke,
        pypi-smoke-musl,
        compute-wasm,
      ]
    # Right away for the version pull request; after every build and check when this push
    # releases; not at all when there is nothing to do (plan).
    if: >-
      always() && needs.plan.result == 'success' && (needs.plan.outputs.changesets == 'true' || (
      needs.plan.outputs.release == 'true' &&
      needs.native-global.result == 'success' && needs.crates-dry-run.result == 'success' &&
      needs.npm-smoke.result == 'success' && needs.npm-smoke-musl.result == 'success' &&
      needs.pypi-smoke.result == 'success' && needs.pypi-smoke-musl.result == 'success' &&
      needs.compute-wasm.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # The version just released (`v<version>` tag and GitHub release), or empty.
      version: ${{ steps.tag.outputs.version }}
    # Restrict the environment to the main branch in the repository settings and name it in the
    # trusted publisher configuration on npmjs.com.
    environment: npm
    permissions:
      contents: write # release commit and tags (pushed through the GitHub API)
      pull-requests: write # the "Version Packages" pull request
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No caches in a job that publishes: a poisoned cache would end up in the packages.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # The platform packages tested by npm-smoke, for `scripts/npm-platforms.ts publish`.
      - if: needs.plan.outputs.release == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: target/npm/
      # The modules of @kgdiff/compute; `pnpm release` fails without them: check:packages packs
      # wasm/, and `pnpm check` runs the corpus on the tests' module in test/wasm/ (never packed).
      - if: needs.plan.outputs.release == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compute-wasm
          path: packages/compute/
      - id: changesets
        env:
          KGDIFF_COMPUTE: ${{ needs.plan.outputs.release == 'true' && '1' || '' }}
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          # check → build → check:packages → the platform packages, then @kgdiff/cli listing them
          # → changeset publish (package.json "release")
          publish-script: pnpm release
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"
          # One GitHub release per version (below), not one per package: the <package>@<version>
          # git tags are still pushed.
          create-github-releases: false
      # `pnpm release` wrote the platform packages into @kgdiff/cli's optionalDependencies for
      # changeset publish; the committed manifest has none. Restore it, or the next pnpm command
      # would install them first (pnpm checks the manifests before it runs anything) and fail on
      # the frozen lockfile, as the release notes of 0.8.0 did.
      - name: Restore the committed package manifests
        if: steps.changesets.outputs.published == 'true' || needs.plan.outputs.release == 'true'
        run: |
          git checkout -- packages/cli/package.json
          test -z "$(git status --porcelain -- packages)"
      # The GitHub Action (action.yml) runs the @kgdiff/cli version of its commit: tag the release
      # commit v<version> for `uses: iiwish/kgdiff@v0.2.0` (and Dependabot), and move v<major>
      # there for `uses: iiwish/kgdiff@v0`. Prereleases only get their own tag.
      # The version is @kgdiff/cli's when this run published it. When an earlier run did and this
      # one finishes the release (plan), it is the committed version, once every public package of
      # the workspace is on npm at it: `changeset publish` succeeded with nothing left to publish.
      - name: Tag the GitHub Action
        id: tag
        if: steps.changesets.outputs.published == 'true' || needs.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.changesets.outputs.published-packages }}
          RELEASING: ${{ needs.plan.outputs.release }}
        run: |
          version=$(jq -r '.[] | select(.name == "@kgdiff/cli") | .version' <<<"${PUBLISHED:-[]}")
          if [ -z "$version" ] && [ "$RELEASING" = true ]; then
            version=$(jq -r .version packages/cli/package.json)
            for manifest in packages/*/package.json; do
              if [ "$(jq -r '.private // false' "$manifest")" = true ]; then continue; fi
              name=$(jq -r .name "$manifest")
              test "$(jq -r .version "$manifest")" = "$version"
              test "$(npm view "$name@$version" version)" = "$version"
            done
            echo "Finishing the release of $version: every package is on npm"
          fi
          if [ -z "$version" ]; then exit 0; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          refs="repos/$GITHUB_REPOSITORY/git/refs"
          if ! gh api "$refs" -f ref="refs/tags/v$version" -f sha="$GITHUB_SHA" --silent; then
            # Already there from an earlier attempt of this run: fine if it is this commit.
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --jq .object.sha)
            test "$sha" = "$GITHUB_SHA"
          fi
          case "$version" in *-*) exit 0 ;; esac
          major="v${version%%.*}"
          gh api -X PATCH "$refs/tags/$major" -f sha="$GITHUB_SHA" -F force=true --silent ||
            gh api "$refs" -f ref="refs/tags/$major" -f sha="$GITHUB_SHA" --silent
          echo "Tagged $GITHUB_SHA as v$version and $major"
      # One release, v<version>, for the whole package group: every package's changelog section
      # merged, each change listed once with the packages it changed (scripts/release-notes.ts).
      - name: Create the GitHub release
        if: steps.tag.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag already has a release (an earlier attempt of this run)"
            exit 0
          fi
          # tsx itself, not `pnpm tsx`: pnpm may print to stdout, which is the notes.
          node_modules/.bin/tsx scripts/release-notes.ts "$VERSION" > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --verify-tag --title "$tag" \
            --notes-file "$RUNNER_TEMP/notes.md" $prerelease

  # ─── The native kgdiff (RFC 0002, phase 3) ───────────────────────────────────────────────────
  # dist's build plan: one job per target with its runner, from dist-workspace.toml.
  native-plan:
    name: Plan the native binaries
    needs: plan
    # Before a release, and for check runs.
    if: always() && (github.event_name != 'push' || needs.plan.outputs.release == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tag-flag: ${{ steps.plan.outputs.tag-flag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-dist@0.31.0
      - id: plan
        run: |
          # The tag the release creates for the workspace's version.
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          tag_flag="--tag=v$version"
          dist plan "$tag_flag" --output-format=json > plan.json
          echo "tag-flag=$tag_flag" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -c .ci.github.artifacts_matrix plan.json)" >> "$GITHUB_OUTPUT"

  # RFC 0002 §8, "Build order": the viewer bundles every binary embeds, built once, so that all
  # targets embed the same bytes and the build runners need no Node.js.
  native-viewer:
    name: Build the viewer bundles kgdiff embeds
    needs: plan
    if: always() && (github.event_name != 'push' || needs.plan.outputs.release == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No caches in a release build: a poisoned cache would end up in the binaries.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # The compute add-on inlines the layout-only module (built here: this job also runs when
      # nothing is released, unlike compute-wasm).
      - uses: ./.github/actions/compute-wasm
        with:
          cache: "false"
      - run: pnpm build:viewer-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-assets
          path: crates/kgdiff-report/assets/*.js
          if-no-files-found: error

  native-build:
    name: Build kgdiff (${{ join(matrix.targets, ', ') }})
    needs: [native-plan, native-viewer]
    if: always() && needs.native-plan.result == 'success' && needs.native-viewer.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.native-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml, for this target
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ join(matrix.targets, ' ') }}
      # The binary embeds the viewer bundles (feature `embed-viewer`).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: viewer-assets
          path: crates/kgdiff-report/assets/
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-dist@0.31.0
      - name: Install the target's system packages
        if: matrix.packages_install != null
        shell: bash
        run: ${{ matrix.packages_install }}
      - id: build
        name: Build, archive and checksum
        shell: bash
        env:
          BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
        run: |
          dist build ${{ needs.native-plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      # Every target builds on its own architecture: run what was built, a report included (the
      # viewer bundles must be in).
      - name: Smoke test
        shell: bash
        run: |
          for target in ${{ join(matrix.targets, ' ') }}; do
            bin="target/$target/dist/kgdiff"
            [ -f "$bin.exe" ] && bin="$bin.exe"
            "$bin" --version
            d=examples/datasets/enterprise-kg
            "$bin" "$d/before.json" "$d/after.json" --match auto --hierarchy is_a --stat
            "$bin" "$d/before.json" "$d/after.json" -o "$RUNNER_TEMP/report.html" --reproducible
            grep -q KgdiffCompute "$RUNNER_TEMP/report.html"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.build.outputs.paths }}
            target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
          if-no-files-found: error

  # The checksums of every archive, the installers and the Homebrew formula.
  native-global:
    name: Installers and the Homebrew formula
    needs: [native-plan, native-build]
    if: always() && needs.native-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-dist@0.31.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: target/distrib/
          merge-multiple: true
      - id: build
        run: |
          dist build ${{ needs.native-plan.outputs.tag-flag }} --output-format=json --artifacts=global > dist-manifest.json
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cp dist-manifest.json target/distrib/global-dist-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-global
          path: |
            ${{ steps.build.outputs.paths }}
            target/distrib/global-dist-manifest.json
          if-no-files-found: error

  # Every crate packaged and verified against the others, as `cargo publish --workspace` uploads
  # them (kgdiff-core, kgdiff-formats, kgdiff-layout, kgdiff-report, kgdiff).
  crates-dry-run:
    name: Package the crates (dry run)
    needs: native-viewer
    if: always() && needs.native-viewer.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # kgdiff-report packages the viewer bundles it embeds.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: viewer-assets
          path: crates/kgdiff-report/assets/
      # The viewer bundles are git-ignored build output that kgdiff-report packages: cargo counts
      # them as uncommitted, so --allow-dirty, once nothing else differs from the commit.
      - run: |
          test -z "$(git status --porcelain)"
          cargo publish --workspace --dry-run --locked --allow-dirty

  # ─── npm: @kgdiff/cli runs the native kgdiff (RFC 0002, phase 4) ─────────────────────────────
  # One platform package per target, holding the binary of dist's archive, and @kgdiff/cli listing
  # them as optional dependencies, packed as the release publishes them (scripts/npm-platforms.ts).
  npm-platforms:
    name: Assemble the platform packages of @kgdiff/cli
    needs: native-build
    if: always() && needs.native-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No caches in a release build: a poisoned cache would end up in the packages.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: target/distrib/
      - run: pnpm tsx scripts/npm-platforms.ts assemble target/distrib target/npm
      # The tarballs keep the binaries' executable bit, which artifacts of loose files would lose.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: target/npm/*.tgz
          if-no-files-found: error

  # `kgdiff` through the launcher, with every platform package unpacked next to it, so that it has
  # to pick this machine's (scripts/npm-smoke.mjs): no npm registry involved.
  npm-smoke:
    name: Run kgdiff through @kgdiff/cli (${{ matrix.name }})
    needs: npm-platforms
    if: always() && needs.npm-platforms.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-gnu
            runner: ubuntu-latest
          - name: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - name: darwin-arm64
            runner: macos-15
          - name: win32-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: target/npm/
      - run: node scripts/npm-smoke.mjs target/npm

  # The same on musl (Alpine), where the launcher must not pick the glibc build.
  npm-smoke-musl:
    name: Run kgdiff through @kgdiff/cli (linux-x64-musl)
    needs: npm-platforms
    if: always() && needs.npm-platforms.result == 'success'
    runs-on: ubuntu-latest
    container: node:24-alpine
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: target/npm/
      - run: node scripts/npm-smoke.mjs target/npm

  # ─── PyPI: pykgdiff, the command line only (RFC 0002, D-6 / D-7) ─────────────────────────────
  # One wheel per target, holding the binary of dist's archive (scripts/pypi-wheels.py): the same
  # kgdiff, with the same viewer bundles, as npm and the GitHub release, never a build of its own.
  # No sdist: building from source needs Rust and the viewer bundles; `cargo install kgdiff` is that.
  pypi-wheels:
    name: Assemble the wheels of pykgdiff
    needs: native-build
    if: always() && needs.native-build.result == 'success'
    # Its Python 3.12 (the script needs >= 3.11, standard library only).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: target/distrib/
      - run: python3 scripts/pypi-wheels.py target/distrib target/pypi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-wheels
          path: target/pypi/*.whl
          if-no-files-found: error

  # `pip install pykgdiff` from the wheels alone, so that pip has to pick this machine's by its
  # platform tag, then `kgdiff` on an example dataset (scripts/pypi-smoke.py): no PyPI involved.
  pypi-smoke:
    name: Run kgdiff from the pykgdiff wheel (${{ matrix.name }})
    needs: pypi-wheels
    if: always() && needs.pypi-wheels.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-gnu
            runner: ubuntu-latest
            python: python3
          - name: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            python: python3
          - name: darwin-arm64
            runner: macos-15
            python: python3
          - name: win32-x64
            runner: windows-latest
            python: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-wheels
          path: target/pypi/
      # The runner's own Python: the wheels need none in particular.
      - run: ${{ matrix.python }} scripts/pypi-smoke.py target/pypi

  # The same on musl (Alpine), where pip must pick the musllinux wheel.
  pypi-smoke-musl:
    name: Run kgdiff from the pykgdiff wheel (linux-x64-musl)
    needs: pypi-wheels
    if: always() && needs.pypi-wheels.result == 'success'
    runs-on: ubuntu-latest
    container: python:3.13-alpine
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-wheels
          path: target/pypi/
      - run: python3 scripts/pypi-smoke.py target/pypi

  # Off until PYPI_RELEASE_ENABLED is true (docs/releasing.md, "PyPI"): PyPI trusted publishing
  # (OIDC), no token stored; the first upload creates the project through the pending publisher
  # configured on pypi.org. The wheels tested above, uploaded with attestations. A version PyPI
  # has already is skipped, and a rerun after a partial upload adds only the missing wheels.
  pypi-publish:
    name: Publish pykgdiff to PyPI
    needs: [release, pypi-smoke, pypi-smoke-musl]
    if: >-
      always() && vars.PYPI_RELEASE_ENABLED == 'true' && github.event_name == 'push' &&
      needs.release.outputs.version != '' && needs.pypi-smoke.result == 'success' &&
      needs.pypi-smoke-musl.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Restrict the environment to the main branch in the repository settings and name it in the
    # trusted publisher configuration on pypi.org.
    environment:
      name: pypi
      url: https://pypi.org/project/pykgdiff/
    permissions:
      id-token: write # PyPI trusted publishing and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-wheels
          path: dist/
      - name: Check the wheels against the release, and what PyPI has
        id: pypi
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # The version as PyPI spells it (scripts/sync-versions.ts, pep440).
          version=$(sed -E 's/-alpha\./a/; s/-beta\./b/; s/-rc\./rc/' <<<"$VERSION")
          wheels=$(cd dist && ls pykgdiff-*.whl)
          # One wheel per dist target, all of this version.
          test "$(grep -c . <<<"$wheels")" = 7
          test -z "$(grep -v "^pykgdiff-$version-py3-none-" <<<"$wheels" || true)"
          agent="kgdiff release workflow (https://github.com/iiwish/kgdiff)"
          status=$(curl -sS -o "$RUNNER_TEMP/pypi.json" -w '%{http_code}' -A "$agent" \
            "https://pypi.org/pypi/pykgdiff/$version/json")
          if [ "$status" = 200 ]; then
            uploaded=$(jq -r '.urls[].filename' "$RUNNER_TEMP/pypi.json")
            if [ -z "$(grep -vxF -f <(echo "$uploaded") <<<"$wheels" || true)" ]; then
              echo "Skipped: pykgdiff $version is on PyPI with every wheel already."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "pykgdiff $version is on PyPI without some wheels: uploading the others."
          else
            test "$status" = 404
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - if: steps.pypi.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true

  # Off until NATIVE_RELEASE_ENABLED is true (docs/releasing.md, "Native binaries"): attests the
  # archives, uploads them with the installers and checksums to the release's GitHub release, and
  # pushes the formula to iiwish/homebrew-tap with the HOMEBREW_TAP_TOKEN secret.
  native-publish:
    name: Publish the native binaries
    needs: [release, native-build, native-global, crates-dry-run]
    if: >-
      always() && vars.NATIVE_RELEASE_ENABLED == 'true' && github.event_name == 'push' &&
      needs.release.outputs.version != '' && needs.native-global.result == 'success' &&
      needs.crates-dry-run.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: native
    permissions:
      contents: write # release assets
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: dist/
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.xz
            dist/*.zip
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release upload "v$VERSION" -R "$GITHUB_REPOSITORY" --clobber \
            dist/*.tar.xz dist/*.tar.xz.sha256 dist/*.zip dist/*.zip.sha256 \
            dist/*-installer.* dist/sha256.sum
      - name: Push the formula to iiwish/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/iiwish/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/kgdiff.rb tap/Formula/kgdiff.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kgdiff.rb
          git commit -m "kgdiff $VERSION"
          git push

  # Off until CRATES_RELEASE_ENABLED is true: crates.io trusted publishing (OIDC), no token
  # stored. crates.io cannot create a crate through trusted publishing, so each crate's first
  # version is published by hand (kgdiff-core at 0.7.0, the others when their phase ships) and this
  # job publishes only the crates that exist there; it skips the others, saying so
  # (docs/releasing.md, "Native binaries and crates").
  crates-publish:
    name: Publish the crates
    needs: [release, crates-dry-run, native-global]
    if: >-
      always() && vars.CRATES_RELEASE_ENABLED == 'true' && github.event_name == 'push' &&
      needs.release.outputs.version != '' && needs.crates-dry-run.result == 'success' &&
      needs.native-global.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: viewer-assets
          path: crates/kgdiff-report/assets/
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      # In dependency order; a version already on crates.io is skipped too, so a rerun is safe.
      # The viewer bundles are git-ignored build output that kgdiff-report packages: cargo counts
      # them as uncommitted, so --allow-dirty, once nothing else differs from the commit.
      - name: Publish the crates that exist on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          test -z "$(git status --porcelain)"
          api=https://crates.io/api/v1/crates
          agent="kgdiff release workflow (https://github.com/iiwish/kgdiff)"
          for crate in kgdiff-core kgdiff-formats kgdiff-layout kgdiff-report kgdiff; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' -A "$agent" "$api/$crate")
            if [ "$status" = 404 ]; then
              echo "::notice::Skipped $crate: it is not on crates.io yet, and trusted publishing cannot create a crate. Publish its first version by hand (docs/releasing.md)."
              continue
            fi
            test "$status" = 200
            status=$(curl -sS -o /dev/null -w '%{http_code}' -A "$agent" "$api/$crate/$VERSION")
            if [ "$status" = 200 ]; then
              echo "Skipped $crate: $VERSION is already on crates.io."
              continue
            fi
            echo "Publishing $crate $VERSION"
            cargo publish -p "$crate" --locked --allow-dirty
          done
