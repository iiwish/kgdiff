name: Release

# On every push to main, changesets/action either opens / updates the "Version Packages" pull
# request (while there are changesets in .changeset/), or, once that pull request is merged,
# builds, checks and publishes the packages that have a new version, then tags the release and
# creates one GitHub release for it.
#
# Publishing uses npm trusted publishing (OIDC): no npm token is stored anywhere, and npm adds a
# provenance attestation to every version. Setup and the first publish: docs/releasing.md.
#
# The native kgdiff (RFC 0002, phase 3) is built for every target with dist (dist-workspace.toml)
# and its crates are packaged and verified (`cargo publish --dry-run`) for each release, and on a
# pull request that changes this setup or by hand (workflow_dispatch), without publishing. Its
# publishing jobs stay off until the repository variables NATIVE_RELEASE_ENABLED and
# CRATES_RELEASE_ENABLED are set (docs/releasing.md, "Native binaries"). npm's @kgdiff/cli and the
# GitHub Action stay on the TypeScript CLI until phase 4.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - dist-workspace.toml
  workflow_dispatch:

permissions: {}

concurrency:
  # Releases queue up; a check run of a pull request or by hand has a group of its own.
  group: ${{ github.event_name == 'push' && 'release' || format('release-check-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    # Not in forks, and not before the first release, which is published by hand: set the
    # repository variable RELEASE_ENABLED to true once trusted publishing is configured
    # (docs/releasing.md).
    if: github.event_name == 'push' && github.repository == 'iiwish/kgdiff' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # The version just released (`v<version>` tag and GitHub release), or empty.
      version: ${{ steps.tag.outputs.version }}
    # Restrict the environment to the main branch in the repository settings and name it in the
    # trusted publisher configuration on npmjs.com.
    environment: npm
    permissions:
      contents: write # release commit and tags (pushed through the GitHub API)
      pull-requests: write # the "Version Packages" pull request
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No caches in a job that publishes: a poisoned cache would end up in the packages.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          # build → check:packages → changeset publish (package.json "release")
          publish-script: pnpm release
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"
          # One GitHub release per version (below), not one per package: the <package>@<version>
          # git tags are still pushed.
          create-github-releases: false
      # The GitHub Action (action.yml) runs the @kgdiff/cli version of its commit: tag the release
      # commit v<version> for `uses: iiwish/kgdiff@v0.2.0` (and Dependabot), and move v<major>
      # there for `uses: iiwish/kgdiff@v0`. Prereleases only get their own tag.
      - name: Tag the GitHub Action
        id: tag
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.changesets.outputs.published-packages }}
        run: |
          version=$(jq -r '.[] | select(.name == "@kgdiff/cli") | .version' <<<"$PUBLISHED")
          if [ -z "$version" ]; then exit 0; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          refs="repos/$GITHUB_REPOSITORY/git/refs"
          if ! gh api "$refs" -f ref="refs/tags/v$version" -f sha="$GITHUB_SHA" --silent; then
            # Already there from an earlier attempt of this run: fine if it is this commit.
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --jq .object.sha)
            test "$sha" = "$GITHUB_SHA"
          fi
          case "$version" in *-*) exit 0 ;; esac
          major="v${version%%.*}"
          gh api -X PATCH "$refs/tags/$major" -f sha="$GITHUB_SHA" -F force=true --silent ||
            gh api "$refs" -f ref="refs/tags/$major" -f sha="$GITHUB_SHA" --silent
          echo "Tagged $GITHUB_SHA as v$version and $major"
      # One release, v<version>, for the whole package group: every package's changelog section
      # merged, each change listed once with the packages it changed (scripts/release-notes.ts).
      - name: Create the GitHub release
        if: steps.tag.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag already has a release (an earlier attempt of this run)"
            exit 0
          fi
          pnpm tsx scripts/release-notes.ts "$VERSION" > "$RUNNER_TEMP/notes.md"
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --verify-tag --title "$tag" \
            --notes-file "$RUNNER_TEMP/notes.md" $prerelease

  # ─── The native kgdiff (RFC 0002, phase 3) ───────────────────────────────────────────────────
  # dist's build plan: one job per target with its runner, from dist-workspace.toml.
  native-plan:
    name: Plan the native binaries
    needs: release
    # After a release that published a version, and for check runs; never after a failed release.
    if: >-
      always() && needs.release.result != 'failure' && needs.release.result != 'cancelled' &&
      (github.event_name != 'push' || needs.release.outputs.version != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tag-flag: ${{ steps.plan.outputs.tag-flag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-dist@0.31.0
      - id: plan
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # A release builds for its tag; a check run for the workspace's version.
          version="${VERSION:-$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)}"
          tag_flag="--tag=v$version"
          dist plan "$tag_flag" --output-format=json > plan.json
          echo "tag-flag=$tag_flag" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -c .ci.github.artifacts_matrix plan.json)" >> "$GITHUB_OUTPUT"

  native-build:
    name: Build kgdiff (${{ join(matrix.targets, ', ') }})
    needs: native-plan
    if: always() && needs.native-plan.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.native-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml, for this target
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ join(matrix.targets, ' ') }}
      # RFC 0002 §8, "Build order": the binary embeds the viewer bundles.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No caches in a release build: a poisoned cache would end up in the binaries.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:viewer-assets
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-dist@0.31.0
      - name: Install the target's system packages
        if: matrix.packages_install != null
        shell: bash
        run: ${{ matrix.packages_install }}
      - id: build
        name: Build, archive and checksum
        shell: bash
        env:
          BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
        run: |
          dist build ${{ needs.native-plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      # Every target builds on its own architecture: run what was built, a report included (the
      # viewer bundles must be in).
      - name: Smoke test
        shell: bash
        run: |
          for target in ${{ join(matrix.targets, ' ') }}; do
            bin="target/$target/dist/kgdiff"
            [ -f "$bin.exe" ] && bin="$bin.exe"
            "$bin" --version
            d=examples/datasets/enterprise-kg
            "$bin" "$d/before.json" "$d/after.json" --match auto --hierarchy is_a --stat
            "$bin" "$d/before.json" "$d/after.json" -o "$RUNNER_TEMP/report.html" --reproducible
            grep -q KgdiffCompute "$RUNNER_TEMP/report.html"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.build.outputs.paths }}
            target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
          if-no-files-found: error

  # The checksums of every archive, the installers and the Homebrew formula.
  native-global:
    name: Installers and the Homebrew formula
    needs: [native-plan, native-build]
    if: always() && needs.native-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-dist@0.31.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: target/distrib/
          merge-multiple: true
      - id: build
        run: |
          dist build ${{ needs.native-plan.outputs.tag-flag }} --output-format=json --artifacts=global > dist-manifest.json
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cp dist-manifest.json target/distrib/global-dist-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-global
          path: |
            ${{ steps.build.outputs.paths }}
            target/distrib/global-dist-manifest.json
          if-no-files-found: error

  # Every crate packaged and verified against the others, as `cargo publish --workspace` uploads
  # them (kgdiff-core, kgdiff-formats, kgdiff-report, kgdiff).
  crates-dry-run:
    name: Package the crates (dry run)
    needs: release
    if: >-
      always() && needs.release.result != 'failure' && needs.release.result != 'cancelled' &&
      (github.event_name != 'push' || needs.release.outputs.version != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # kgdiff-report packages the viewer bundles it embeds.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:viewer-assets
      # The viewer bundles are git-ignored build output that kgdiff-report packages: cargo counts
      # them as uncommitted, so --allow-dirty, once nothing else differs from the commit.
      - run: |
          test -z "$(git status --porcelain)"
          cargo publish --workspace --dry-run --locked --allow-dirty

  # Off until NATIVE_RELEASE_ENABLED is true (docs/releasing.md, "Native binaries"): attests the
  # archives, uploads them with the installers and checksums to the release's GitHub release, and
  # pushes the formula to iiwish/homebrew-tap with the HOMEBREW_TAP_TOKEN secret.
  native-publish:
    name: Publish the native binaries
    needs: [release, native-build, native-global, crates-dry-run]
    if: >-
      always() && vars.NATIVE_RELEASE_ENABLED == 'true' && github.event_name == 'push' &&
      needs.release.outputs.version != '' && needs.native-global.result == 'success' &&
      needs.crates-dry-run.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: native
    permissions:
      contents: write # release assets
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: dist/
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.xz
            dist/*.zip
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release upload "v$VERSION" -R "$GITHUB_REPOSITORY" --clobber \
            dist/*.tar.xz dist/*.tar.xz.sha256 dist/*.zip dist/*.zip.sha256 \
            dist/*-installer.* dist/sha256.sum
      - name: Push the formula to iiwish/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/iiwish/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/kgdiff.rb tap/Formula/kgdiff.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kgdiff.rb
          git commit -m "kgdiff $VERSION"
          git push

  # Off until CRATES_RELEASE_ENABLED is true: crates.io trusted publishing (OIDC), no token
  # stored. Configure the trusted publisher of each crate first (docs/releasing.md).
  crates-publish:
    name: Publish the crates
    needs: [release, crates-dry-run, native-global]
    if: >-
      always() && vars.CRATES_RELEASE_ENABLED == 'true' && github.event_name == 'push' &&
      needs.release.outputs.version != '' && needs.crates-dry-run.result == 'success' &&
      needs.native-global.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:viewer-assets
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - run: |
          test -z "$(git status --porcelain)"
          cargo publish --workspace --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
