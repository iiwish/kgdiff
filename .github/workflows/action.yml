name: Action

# Runs the GitHub Action in action.yml (`uses: ./`) on the example datasets: a scratch
# repository whose first commit holds the "before" versions and whose second holds the "after"
# versions, plus a new file, a deleted file and an unchanged one. On a pull request from this
# repository the Ubuntu job comments, and updates that comment on every later push. The
# read-only job gets the token that pull requests from forks get: it must pass without a
# comment.

on:
  pull_request:
    paths:
      - action.yml
      - action/**
      - examples/datasets/**
      - .github/workflows/action.yml
  push:
    branches: [main]
    paths:
      - action.yml
      - action/**
      - examples/datasets/**
      - .github/workflows/action.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  run:
    name: Run the action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # the comment
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: fixture
        name: Commit two versions of the example graphs
        shell: bash
        run: |
          set -euo pipefail
          datasets="$GITHUB_WORKSPACE/examples/datasets"
          repo="$RUNNER_TEMP/graphs"
          mkdir -p "$repo/ontology" "$repo/data" "$repo/vocab"
          cd "$repo"
          git init -q -b main
          git config user.name kgdiff
          git config user.email kgdiff@users.noreply.github.com
          git config core.autocrlf false
          cp "$datasets/ontology-release/before.obo" ontology/disease.obo
          cp "$datasets/enterprise-kg/before.json" data/enterprise.json
          cp "$datasets/data-lineage/before.json" data/lineage.json
          cp "$datasets/llm-extraction/before.json" data/extraction.json
          cp "$datasets/schema-vocab/before.ttl" vocab/schema.ttl
          git add -A
          git commit -q -m before
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cp "$datasets/ontology-release/after.obo" ontology/disease.obo
          cp "$datasets/enterprise-kg/after.json" data/enterprise.json
          git rm -q data/lineage.json
          cp "$datasets/llm-extraction/after.json" data/extraction-run-b.json
          cp "$datasets/schema-vocab/after.ttl" vocab/schema.ttl
          git add -A
          git commit -q -m after

      - id: kgdiff
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/graphs
          base: ${{ steps.fixture.outputs.base }}
          files: |
            ontology/disease.obo
            data/*.json
            vocab/**/*.ttl
          args: --lang en
          name: kgdiff-${{ matrix.os }}
          comment: ${{ matrix.os == 'ubuntu-latest' }}
      - name: Check the outputs
        shell: bash
        env:
          CHANGED: ${{ steps.kgdiff.outputs.changed }}
          SUMMARY: ${{ steps.kgdiff.outputs.summary-file }}
          ARTIFACT_URL: ${{ steps.kgdiff.outputs.artifact-url }}
          COMMENT_URL: ${{ steps.kgdiff.outputs.comment-url }}
          EXPECT_COMMENT: ${{ matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          test "$CHANGED" = true
          test -n "$ARTIFACT_URL"
          for heading in ontology/disease.obo data/enterprise.json data/extraction-run-b.json data/lineage.json vocab/schema.ttl; do
            grep -F -q "## kgdiff · $heading: " "$SUMMARY"
          done
          grep -F -q '**Unchanged (same as on ' "$SUMMARY"
          grep -F -q 'data/extraction.json' "$SUMMARY"
          if [ "$EXPECT_COMMENT" = true ]; then test -n "$COMMENT_URL"; echo "Comment: $COMMENT_URL"; fi

      - id: fail
        name: Fail on changes
        uses: ./
        continue-on-error: true
        with:
          working-directory: ${{ runner.temp }}/graphs
          base: ${{ steps.fixture.outputs.base }}
          files: vocab/schema.ttl
          name: kgdiff-fail-${{ matrix.os }}
          comment: false
          fail-on-changes: true
          locale: zh-CN
      - name: Check that it failed
        shell: bash
        env:
          OUTCOME: ${{ steps.fail.outcome }}
        run: test "$OUTCOME" = failure

      - name: Compare this checkout with the pull request base
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          files: examples/datasets/*/after.*
          name: kgdiff-examples-${{ matrix.os }}
          comment: false

  read-only:
    name: Run the action with a read-only token and Node.js 20
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # what a pull request from a fork gets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Too old for kgdiff: the action sets up a newer Node.js itself.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      - id: fixture
        name: Commit two versions of an example graph
        shell: bash
        run: |
          set -euo pipefail
          datasets="$GITHUB_WORKSPACE/examples/datasets"
          repo="$RUNNER_TEMP/graphs"
          mkdir -p "$repo"
          cd "$repo"
          git init -q -b main
          git config user.name kgdiff
          git config user.email kgdiff@users.noreply.github.com
          cp "$datasets/schema-vocab/before.ttl" schema.ttl
          git add -A
          git commit -q -m before
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cp "$datasets/schema-vocab/after.ttl" schema.ttl
          git commit -q -am after
      - id: kgdiff
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/graphs
          base: ${{ steps.fixture.outputs.base }}
          files: schema.ttl
          name: kgdiff-read-only
      - name: Check the outputs
        env:
          CHANGED: ${{ steps.kgdiff.outputs.changed }}
          COMMENT_URL: ${{ steps.kgdiff.outputs.comment-url }}
        run: test "$CHANGED" = true && test -z "$COMMENT_URL"
