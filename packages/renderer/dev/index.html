<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kgdiff renderer harness</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e14;
        --overlay: rgba(17, 21, 29, 0.78);
        --border: rgba(255, 255, 255, 0.07);
        --text: #e7ebf3;
        --muted: #a6afbf;
        --accent: #7c9cff;
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.45), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
      }
      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #f7f8fa;
        --overlay: rgba(255, 255, 255, 0.82);
        --border: rgba(15, 23, 42, 0.08);
        --text: #0f172a;
        --muted: #475569;
        --accent: #3b5bdb;
        --shadow: 0 8px 28px rgba(15, 23, 42, 0.1), 0 1px 2px rgba(15, 23, 42, 0.06);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 Inter, 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      .card {
        position: fixed;
        background: var(--overlay);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 12px 14px;
      }
      #panel {
        top: 16px;
        left: 16px;
        width: 320px;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 10px;
      }
      #panel h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #panel h1 span {
        color: var(--muted);
        font-weight: 400;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        color: var(--muted);
      }
      input[type='range'] {
        width: 120px;
        accent-color: var(--accent);
      }
      input[type='checkbox'] {
        accent-color: var(--accent);
      }
      button {
        font: inherit;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px 10px;
        min-height: 28px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button[aria-pressed='true'] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #readout {
        font: 12px/1.5 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace;
        color: var(--muted);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        min-height: 54px;
      }
      #readout b {
        color: var(--text);
        font-weight: 600;
      }
      #bench {
        font: 11.5px/1.5 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace;
        color: var(--muted);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #minimap {
        position: fixed;
        right: 16px;
        bottom: 16px;
      }
      select {
        font: inherit;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 4px 6px;
        min-height: 28px;
        max-width: 190px;
      }
      select option {
        color: #0f172a;
      }
      .segmented {
        display: flex;
        gap: 4px;
        margin: 0;
        padding: 0;
        border: 0;
        min-width: 0;
      }
      .segmented button {
        padding: 5px 8px;
      }
      #replay {
        flex: 1;
        min-width: 0;
        width: auto;
      }
      #time {
        font: 11.5px/1.4 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace;
        color: var(--muted);
        min-width: 92px;
        text-align: right;
      }
      body[data-mode='synthetic'] .dataset-only,
      body[data-mode='dataset'] .synthetic-only {
        display: none;
      }
      #hint {
        right: 16px;
        top: 16px;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body data-mode="synthetic">
    <div id="stage"></div>
    <section id="panel" class="card" aria-label="Harness controls">
      <h1>kgdiff renderer <span>· dev harness</span></h1>
      <div class="row">
        <span>Source</span>
        <select id="source" aria-label="Frame source">
          <option value="synthetic">Synthetic frame</option>
        </select>
      </div>
      <div class="row dataset-only">
        <fieldset class="segmented" aria-label="Layer">
          <button type="button" data-layer="union" aria-pressed="true">Union</button>
          <button type="button" data-layer="before" aria-pressed="false">Before</button>
          <button type="button" data-layer="after" aria-pressed="false">After</button>
          <button type="button" data-layer="replay" aria-pressed="false">Replay</button>
        </fieldset>
      </div>
      <div class="row dataset-only">
        <button type="button" id="play" aria-label="Play replay">▶</button>
        <input id="replay" type="range" min="0" max="1000" value="0" aria-label="Replay time" />
        <span id="time">0.0 s</span>
      </div>
      <div class="row dataset-only">
        <span>Locale</span>
        <fieldset class="segmented" aria-label="Locale">
          <button type="button" data-locale="zh-CN" aria-pressed="true">中文</button>
          <button type="button" data-locale="en" aria-pressed="false">EN</button>
        </fieldset>
      </div>
      <div class="row">
        <span>Theme</span>
        <span>
          <button type="button" id="dark" aria-pressed="true">Dark</button>
          <button type="button" id="light" aria-pressed="false">Light</button>
        </span>
      </div>
      <div class="row">
        <label><input id="swipe" type="checkbox" /> Swipe</label>
        <input id="split" type="range" min="0" max="100" value="50" aria-label="Swipe divider" />
      </div>
      <div class="row">
        <label><input id="layers" type="checkbox" /> Host layers (under and over)</label>
      </div>
      <div class="row synthetic-only">
        <label><input id="animate" type="checkbox" /> Animate pulse / progress</label>
      </div>
      <div class="row synthetic-only">
        <label><input id="stress" type="checkbox" /> Stress: 10,000 nodes</label>
      </div>
      <div class="row">
        <button type="button" id="fit">Fit</button>
        <button type="button" id="fly">Fly to a change</button>
        <button type="button" id="run" class="synthetic-only">Benchmark</button>
      </div>
      <div id="readout" aria-live="polite"></div>
      <div id="bench"></div>
    </section>
    <div id="hint" class="card">Drag to pan · wheel / pinch to zoom · F fit · click a change to select its hunk</div>
    <div id="minimap"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
