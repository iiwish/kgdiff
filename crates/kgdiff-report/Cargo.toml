[package]
name = "kgdiff-report"
description = "The text outputs and HTML reports of kgdiff: terminal summary, --stat, --name-status, Markdown and the report document, as kgdiff prints them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["kgdiff", "diff", "knowledge-graph", "report", "markdown"]
categories = ["command-line-interface", "text-processing"]
# `assets/` is git-ignored (the viewer build writes it) but packaged: listing the files here
# makes `cargo package` take them regardless of `.gitignore` (RFC 0002, §8, "Build order").
include = [
  "/Cargo.toml",
  "/README.md",
  "/build.rs",
  "/src/**",
  "/tests/**",
  "/examples/**",
  "/assets/*.js",
]

[features]
# Embeds the viewer bundles (`assets/`, copied there by `pnpm build:viewer-assets`) for HTML
# reports (RFC 0002, §8, "Build order"). Without it, or without the assets (the build warns),
# `embedded_viewer()` is `None` and the caller passes the bundles in.
embed-viewer = []

[dependencies]
base64 = "0.22"
flate2 = "1.1"
icu_properties = "2.4"
icu_segmenter = "2.4"
kgdiff-core.workspace = true
kgdiff-layout.workspace = true

[dev-dependencies]
kgdiff-formats = { path = "../kgdiff-formats" }

[lints]
workspace = true
