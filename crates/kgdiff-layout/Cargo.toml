[package]
name = "kgdiff-layout"
description = "Stable, deterministic, label-aware layout for knowledge-graph diffs: both versions share one mental map, identical on every platform and in WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["kgdiff", "layout", "force-directed", "graph", "knowledge-graph"]
categories = ["algorithms", "visualization"]
# Not on crates.io yet: a published crate needs a version requirement on its path dependency
# (cargo-deny bans the wildcard otherwise), and scripts/sync-versions.ts does not keep such
# requirements at the shared version yet. Both come with the release of the crates (RFC 0002, §8).
publish = false

[dependencies]
icu_properties = "2.4"
kgdiff-core = { path = "../kgdiff-core" }

[dev-dependencies]
serde_json = { workspace = true, features = ["float_roundtrip"] }

# The conformance corpus (conformance/README.md): the layout contract of every case and
# primitives/label-width.json.
[[test]]
name = "conformance"
path = "tests/conformance/main.rs"
harness = false

[lints]
workspace = true

