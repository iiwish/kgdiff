[package]
name = "kgdiff-core"
description = "Semantic diff engine for knowledge graphs: node matching, change classification, hunks, deterministic JSON documents and invertible deltas."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["kgdiff", "diff", "knowledge-graph", "ontology", "graph"]
categories = ["algorithms", "data-structures"]

[dependencies]
foldhash = "0.2"
icu_casemap = "2.4"
icu_locale_core = "2.4"
icu_normalizer = "2.4"
icu_properties = "2.4"
indexmap = "2.14"
ryu-js = "1.0.3"

[dev-dependencies]
divan = "0.1"
flate2 = "1.1"
# The conformance harness parses the corpus inputs (README, "Library outputs", steps 1 and 2) and
# computes every library output from them (RFC 0002, phase 3). A dev-dependency cycle: the
# integration tests link one kgdiff-core.
kgdiff-formats = { path = "../kgdiff-formats" }
proptest = "1.12"
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = "0.11"

# The conformance corpus (conformance/README.md), with its own report of what passes.
[[test]]
name = "conformance"
path = "tests/conformance/main.rs"
harness = false

[lints]
workspace = true

# The native targets of RFC 0002 §7 (`cargo bench -p kgdiff-core`).
[[bench]]
name = "diff"
harness = false
